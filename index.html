<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152b"><title>Ilha do Caos — Corrida</title><style>
*{box-sizing:border-box}body{margin:0;background:#10152b;color:#f5f7ff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:14px}.game{width:min(900px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}.top h1{font-size:clamp(20px,4vw,30px);margin:0;color:#9fffd3}.stats{display:flex;gap:8px}.pill{background:#202947;border:1px solid #374469;padding:7px 12px;border-radius:999px;font-weight:700}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#9de7ed;border:2px solid #445273;border-radius:16px;box-shadow:0 12px 40px #0008;touch-action:none}.help{color:#bac5df;font-size:14px;margin:9px 0}.controls{display:flex;justify-content:center;gap:12px;margin-top:10px}.controls button,.panel button{border:1px solid #52618b;border-radius:14px;background:#202947;color:white;font-size:24px;font-weight:900;min-width:62px;height:52px;touch-action:none}.controls button.jump{background:#71efb4;color:#10231c;min-width:110px;font-size:18px}.overlay{position:fixed;inset:0;background:#080c19d9;display:grid;place-items:center;padding:20px}.panel{max-width:450px;background:#1b2441;border:1px solid #52618b;border-radius:20px;padding:26px;box-shadow:0 20px 60px #0008}.panel h2{margin-top:0;color:#9fffd3}.panel button{background:#71efb4;color:#10231c;font-size:17px;padding:0 24px;cursor:pointer}.small{font-size:13px;color:#bac5df}@media(min-width:760px){.controls{display:none}}
</style></head><body><main class="game"><div class="top"><h1>🏝️ Ilha do Caos: Corrida</h1><div class="stats"><span class="pill">💚 <b id="hp">3</b></span><span class="pill">💎 <b id="score">0</b></span><span class="pill">🏁 <b id="dist">0</b> m</span></div></div><canvas id="c" width="900" height="506" aria-label="Jogo de plataforma com personagem que corre e pula"></canvas><p class="help">← → ou A/D para correr · Espaço, ↑ ou W para pular · Pegue cristais e desvie dos monstros!</p><div class="controls"><button data-key="left">◀</button><button class="jump" data-key="jump">PULAR ⤒</button><button data-key="right">▶</button></div></main><div class="overlay" id="screen"><section class="panel"><h2>Corra e pule! 🏃</h2><p>Ajude o aventureiro a atravessar a ilha, saltando sobre os monstros e pegando cristais. Você tem 3 corações.</p><button id="go">JOGAR</button><p class="small">No celular, use os botões abaixo do jogo.</p></section></div>
<script>
(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),screen=document.getElementById('screen'),W=c.width,H=c.height,G=425;let keys={},p,plats,coins,foes,score,hp,dist,cam,running,last,anim=0;function reset(){p={x:70,y:G-54,w:34,h:48,vx:0,vy:0,ground:false,inv:0};plats=[{x:0,y:G,w:1700,h:H-G},{x:1850,y:G,w:780,h:H-G},{x:2810,y:G,w:1200,h:H-G},{x:4190,y:G,w:1100,h:H-G}];coins=[];foes=[];for(let x=260;x<5200;x+=Math.random()*180+190){if(Math.random()<.72)coins.push({x,y:G-65-Math.random()*70,got:false});if(Math.random()<.56)foes.push({x:x+80,y:G-32,w:32,h:30,alive:true})}for(let x=620;x<5100;x+=Math.random()*270+260){plats.push({x,y:G-90-Math.random()*65,w:100+Math.random()*100,h:15})}score=0;hp=3;dist=0;cam=0;hud()}function hud(){document.getElementById('hp').textContent=hp;document.getElementById('score').textContent=score;document.getElementById('dist').textContent=dist}
function start(){reset();screen.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}function finish(win=false){running=false;screen.innerHTML=`<section class="panel"><h2>${win?'Você venceu a corrida! 🏆':'Fim de jogo!'}</h2><p>Você correu <b>${dist} metros</b> e pegou <b>${score} cristais</b>.</p><button id="again">JOGAR DE NOVO</button></section>`;screen.style.display='grid';document.getElementById('again').onclick=start}function jump(){if(p&&p.ground){p.vy=-12.3;p.ground=false}}function loop(now){if(!running)return;let dt=Math.min(32,now-last)/16.67;last=now;update(dt);draw();requestAnimationFrame(loop)}function update(d){anim+=d;let left=keys.left||keys.ArrowLeft||keys.a||keys.A,right=keys.right||keys.ArrowRight||keys.d||keys.D;if(left)p.vx-=.55*d;if(right)p.vx+=.55*d;p.vx=Math.max(-4.2,Math.min(4.2,p.vx));if(!left&&!right)p.vx*=Math.pow(.78,d);if((keys.jump||keys[' ']||keys.ArrowUp||keys.w||keys.W)&&p.ground)jump();let oldY=p.y;p.x+=p.vx*d;p.vy+=.62*d;p.y+=p.vy*d;p.ground=false;for(const a of plats){if(p.x+p.w>a.x&&p.x<a.x+a.w&&oldY+p.h<=a.y+5&&p.y+p.h>=a.y&&p.vy>=0){p.y=a.y-p.h;p.vy=0;p.ground=true}}if(p.y>H+130){hp--;p.x=Math.max(40,p.x-260);p.y=G-80;p.vy=0;if(hp<=0){hud();finish();return}}if(p.inv>0)p.inv-=d;for(const q of coins){if(!q.got&&p.x<q.x+14&&p.x+p.w>q.x-14&&p.y<q.y+14&&p.y+p.h>q.y-14){q.got=true;score++;}}for(const e of foes){if(!e.alive)continue;if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){if(p.vy>1&&oldY+p.h<e.y+12){e.alive=false;p.vy=-8;score+=2}else if(p.inv<=0){hp--;p.inv=90;p.vx=p.x<e.x?-6:6;if(hp<=0){hud();finish();return}}}}cam=Math.max(0,p.x-190);dist=Math.max(dist,Math.floor(p.x/10));if(p.x>5200){hud();finish(true);return}hud()}
function draw(){ctx.clearRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#70c9ec');grad.addColorStop(1,'#d1f1cf');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff88';for(let i=0;i<6;i++){let x=((i*200-cam*.25)%(W+160)+W+160)%(W+160)-60;ctx.beginPath();ctx.ellipse(x,90+i%3*42,45,14,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#70b977';for(let i=0;i<8;i++){let x=((i*160-cam*.5)%(W+180)+W+180)%(W+180)-60;ctx.beginPath();ctx.moveTo(x, G);ctx.lineTo(x+70,210+(i%3)*45);ctx.lineTo(x+150,G);ctx.fill()}ctx.save();ctx.translate(-cam,0);for(const a of plats){ctx.fillStyle='#78543b';ctx.fillRect(a.x,a.y,a.w,a.h);ctx.fillStyle='#55c56d';ctx.fillRect(a.x,a.y,a.w,12);for(let x=a.x+14;x<a.x+a.w;x+=32){ctx.fillStyle='#9a7045';ctx.fillRect(x,a.y+19,14,8)}}for(const q of coins)if(!q.got){ctx.fillStyle='#ffe767';ctx.shadowColor='#ffe767';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(q.x,q.y,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff8c6';ctx.fillRect(q.x-2,q.y-6,3,12)}for(const e of foes)if(e.alive){ctx.fillStyle='#ed5477';ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,e.h,9);ctx.fill();ctx.fillStyle='white';ctx.fillRect(e.x+7,e.y+8,5,6);ctx.fillRect(e.x+20,e.y+8,5,6);ctx.fillStyle='#47213d';ctx.fillRect(e.x+9,e.y+21,14,4)}if(p.inv<=0||Math.floor(anim/4)%2===0){ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);let runningPose=p.ground&&Math.abs(p.vx)>.5;ctx.fillStyle='#254a8f';ctx.fillRect(-12,-4,24,22);ctx.fillStyle='#f3bd8b';ctx.beginPath();ctx.arc(0,-15,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a2d28';ctx.fillRect(-12,-28,24,8);ctx.fillRect(4,-16,3,3);ctx.strokeStyle='#293757';ctx.lineWidth=6;ctx.beginPath();let swing=runningPose?Math.sin(anim*1.1)*8:0;ctx.moveTo(-7,16);ctx.lineTo(-8+swing,26);ctx.lineTo(-10-swing,31);ctx.moveTo(7,16);ctx.lineTo(8-swing,26);ctx.lineTo(10+swing,31);ctx.stroke();ctx.strokeStyle='#f3bd8b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-18-swing,9);ctx.moveTo(11,0);ctx.lineTo(18+swing,8);ctx.stroke();ctx.restore()}ctx.restore();ctx.fillStyle='#ffffffdd';ctx.font='bold 17px system-ui';ctx.fillText('CHEGADA →',W-135,50)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','A','d','D','w','W'].includes(e.key))e.preventDefault();let was=keys[e.key];keys[e.key]=true;if(!was&&(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'))jump()});document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('.controls button').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;if(k==='jump')jump()},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});document.getElementById('go').onclick=start;
})();</script></body></html>
